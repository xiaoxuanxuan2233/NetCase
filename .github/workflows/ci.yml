name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Install
        working-directory: backend
        run: uv sync --locked
      - name: Lint and format
        working-directory: backend
        run: uv run --no-sync ruff check app tests ../packaging && uv run --no-sync ruff format --check app tests ../packaging
      - name: Tests
        working-directory: backend
        run: uv run --no-sync pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Type check and build
        working-directory: frontend
        run: npm run build
