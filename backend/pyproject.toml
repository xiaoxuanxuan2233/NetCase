[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "netcase"
version = "0.1.0"
description = "Understand your network, not just test it."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.128,<1",
  "pydantic>=2.12,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
